<style>
/* ===== RESET & VARIABLES ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#003B4F;--brand-light:#00647A;--brand-ghost:#E6F0F3;
  --side-bg:#F1F3F4;--side-w:252px;
  --content-bg:#F2F4F5;
  --text:#1A1A2E;--sub:#5F6B7A;--muted:#94A3B8;
  --border:#E2E6EA;--radius:7px;
  --gold:#D4A843;
  --glass-bg:rgba(255,255,255,.55);
  --glass-border:rgba(0,59,79,.07);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.06);
  --danger:#D92D20;--danger-light:#FEE2E2;
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--content-bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}

/* ===== DECORATIVE BACKGROUND BLOBS ===== */
.bg-decor{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-decor .blob{position:absolute;border-radius:50%;opacity:.035}
.bg-decor .blob-1{width:600px;height:600px;background:var(--brand);top:-200px;right:-100px}
.bg-decor .blob-2{width:450px;height:450px;background:var(--brand-light);bottom:-150px;left:-50px;opacity:.025}
.bg-decor .blob-3{width:300px;height:300px;background:var(--gold);top:40%;left:55%;opacity:.02}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh;position:relative;z-index:1}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--side-w);min-width:var(--side-w);background:var(--side-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-placeholder{width:var(--side-w);min-width:var(--side-w);flex-shrink:0}
.side-head{padding:22px 18px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.side-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);cursor:pointer}
.side-logo{width:36px;height:36px;flex-shrink:0}
.side-name{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.side-tag{font-size:10.5px;color:var(--muted);display:block;font-weight:400;letter-spacing:.3px}
.side-nav{flex:1;padding:8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.side-nav::-webkit-scrollbar{width:4px}
.side-nav::-webkit-scrollbar-thumb{background:#C8CDD3;border-radius:2px}
.side-section{margin-top:10px;padding:0 12px 4px}
.side-section:first-child{margin-top:4px}
.side-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:4px 0 2px;margin-bottom:2px}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--sub);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;text-decoration:none;transition:all .15s}
.side-item:hover{background:#E2E7EA;color:var(--text)}
.side-item.active{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,59,79,.18)}
.side-item .si-icon{font-size:15px;line-height:1;width:20px;text-align:center;flex-shrink:0}
.side-item .si-count{font-size:10.5px;background:#DDE1E5;color:var(--sub);padding:1px 7px;border-radius:10px;font-weight:600;margin-left:auto;min-width:20px;text-align:center}
.side-item.active .si-count{background:rgba(255,255,255,.2);color:#fff}
.side-item.local-filter{border:1.5px dashed #B0BDC4;margin-bottom:6px}
.side-item.local-filter:hover{background:#E2E7EA;border-color:var(--brand-light)}
.side-item.local-filter.active{border-style:solid;border-color:var(--brand);background:var(--brand)}
.side-item.ai-directory{border:1.5px solid transparent;margin-top:6px;position:relative}
.side-item.ai-directory .si-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;animation:aiPulse 2s ease-in-out infinite}
@keyframes aiPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.side-foot{padding:14px 18px;border-top:1px solid var(--border);flex-shrink:0}
.side-foot p{font-size:10.5px;color:var(--muted);line-height:1.7}
.side-foot a{color:var(--brand);text-decoration:none;font-weight:500}
.side-foot a:hover{text-decoration:underline}
.side-foot .foot-links{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.side-foot .x-logo{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:#1A1A2E;color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.side-foot .x-logo:hover{background:#333;text-decoration:none}

/* ===== MAIN CONTENT ===== */
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;position:relative;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:18px 40px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.toolbar a{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:color .15s}
.toolbar a:hover{color:var(--brand-light)}
.toolbar .tb-sep{width:1px;height:16px;background:var(--border)}
.toolbar .tb-title{font-size:13px;color:var(--sub);font-weight:500}

/* ===== TOOL LAYOUT ===== */
.tool-layout{display:flex;flex-direction:column;gap:20px;padding:24px 32px;flex:1;align-items:center}
.tool-main{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:18px}

/* ===== BUTTONS ===== */
.btn-action{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 22px;border-radius:9px;border:1.5px solid var(--border);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.btn-action:hover{background:#fff;border-color:#C0C8CE}
.btn-action:active{transform:scale(.98)}
.btn-action:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-action.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 10px rgba(0,59,79,.2)}
.btn-action.btn-primary:hover{background:var(--brand-light);border-color:var(--brand-light)}
.btn-action .btn-emoji{font-size:16px}

/* ===== CONTROLS ===== */
.controls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.size-btn{height:38px;padding:0 16px;border-radius:8px;border:1.5px solid var(--border);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--sub);transition:all .15s}
.size-btn:hover{background:#fff;border-color:#C0C8CE}
.size-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== OPEN ZONE ===== */
.open-zone{width:100%;border:2.5px dashed rgba(0,59,79,.12);border-radius:20px;padding:100px 28px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(255,255,255,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,.03);display:flex;flex-direction:column;align-items:center;gap:14px}
.open-zone:hover{border-color:var(--brand-light);background:rgba(255,255,255,.65);transform:translateY(-1px);box-shadow:0 8px 32px rgba(0,0,0,.08)}
.open-zone .uz-icon{font-size:64px;margin-bottom:4px;opacity:.75}
.open-zone .uz-text{font-size:18px;font-weight:600;color:var(--text)}
.open-zone .uz-sub{font-size:13px;color:var(--muted)}

/* ===== VIEWER LAYOUT ===== */
.viewer-layout{display:flex;gap:0;width:100%;min-height:500px;flex:1}
.thumbnails-panel{width:180px;min-width:180px;background:var(--side-bg);border-right:1px solid var(--border);overflow-y:auto;display:none;padding:10px;gap:8px;flex-direction:column;align-items:center}
.thumbnails-panel.visible{display:flex}
.thumbnails-panel::-webkit-scrollbar{width:4px}
.thumbnails-panel::-webkit-scrollbar-thumb{background:#C8CDD3;border-radius:2px}
.thumb-item{width:140px;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;transition:all .15s;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);flex-shrink:0}
.thumb-item:hover{border-color:var(--brand-light)}
.thumb-item.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-ghost)}
.thumb-item canvas{width:100%;display:block}
.thumb-page-num{font-size:11px;text-align:center;padding:4px 0;color:var(--sub);font-weight:600;background:rgba(255,255,255,.5)}

.viewer-canvas-area{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:20px;background:rgba(0,0,0,.03)}
.viewer-canvas-area canvas{box-shadow:0 2px 16px rgba(0,0,0,.12);background:#fff;max-width:100%}

/* ===== CONTROLS BAR ===== */
.controls-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);position:sticky;bottom:0;z-index:50;flex-wrap:wrap}
.page-info{font-size:13px;font-weight:600;color:var(--sub);min-width:100px;text-align:center}
.page-info span{color:var(--text)}

/* ===== STATUS ===== */
.status-msg{font-size:13px;color:var(--brand);font-weight:600;padding:8px 0;display:none}
.status-msg.error{color:var(--danger)}

/* ===== RESPONSIVE ===== */
@media(max-width:1024px){
  .tool-layout{padding:18px 20px}
}
@media(max-width:768px){
  .sidebar,.sidebar-placeholder{display:none}
  .toolbar{padding:12px 14px}
  .tool-layout{padding:12px 14px}
  .open-zone{padding:60px 20px}
  .thumbnails-panel{width:120px;min-width:120px}
  .thumb-item{width:100px}
  .controls-bar{gap:6px;padding:10px}
}
@media(max-width:420px){
  .btn-action{height:42px;padding:0 16px;font-size:13px}
  .open-zone{padding:40px 16px}
  .open-zone .uz-icon{font-size:48px}
  .open-zone .uz-text{font-size:15px}
  .thumbnails-panel{display:none!important}
}
</style>
</head>

      <div id="openZone" class="open-zone" onclick="document.getElementById('fileInput').click()">

          </button>

          <div class="page-info"><span id="currentPage">1</span> of <span id="totalPages">1</span></div>
          <button class="btn-action" id="btnNext" onclick="nextPage()" style="height:38px;padding:0 14px">Next →</button>
          <span class="tb-sep" style="height:20px"></span>
          <button class="size-btn" data-zoom="75" onclick="setZoom(75, this)">75%</button>
          <button class="size-btn active" data-zoom="100" onclick="setZoom(100, this)">100%</button>
          <button class="size-btn" data-zoom="125" onclick="setZoom(125, this)">125%</button>
          <button class="size-btn" data-zoom="150" onclick="setZoom(150, this)">150%</button>
          <button class="size-btn" data-zoom="fit" onclick="setZoom('fit', this)">Fit Width</button>
          <span class="tb-sep" style="height:20px"></span>
          <button class="btn-action" onclick="resetViewer()" style="height:38px;padding:0 14px;font-size:12.5px">
            <span class="btn-emoji">↩</span> Open Another
          </button>
        </div>

          <div class="thumbnails-panel" id="thumbnailsPanel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var fileInput = document.getElementById("fileInput");
  var openZone = document.getElementById("openZone");
  var viewerArea = document.getElementById("viewerArea");
  var pdfDoc = null;
  var currentPageNum = 1;
  var totalPagesCount = 0;
  var currentZoom = 100; // percentage or 'fit'
  var rendering = false;

  fileInput.addEventListener("change", function(e) {
    if (e.target.files && e.target.files[0]) loadPDF(e.target.files[0]);
  });

  openZone.addEventListener("dragover", function(e) { e.preventDefault(); openZone.style.borderColor = "var(--brand-light)"; });
  openZone.addEventListener("dragleave", function() { openZone.style.borderColor = ""; });
  openZone.addEventListener("drop", function(e) {
    e.preventDefault();
    openZone.style.borderColor = "";
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
  });

  // Also allow drop on viewer area
  var canvasArea = document.getElementById('canvasArea');
  canvasArea.addEventListener("dragover", function(e) { e.preventDefault(); });
  canvasArea.addEventListener("drop", function(e) {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
  });

  async function loadPDF(file) {
    try {
      var arrayBuffer = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPagesCount = pdfDoc.numPages;
      currentPageNum = 1;
      document.getElementById('totalPages').textContent = totalPagesCount;
      document.getElementById('currentPage').textContent = '1';

      openZone.style.display = 'none';
      viewerArea.style.display = 'flex';
      viewerArea.style.flexDirection = 'column';
      viewerArea.style.gap = '0';

      await renderPage(currentPageNum);
      generateThumbnails();
    } catch(err) {
      showStatus('Error loading PDF: ' + err.message, true);
    }
  }

  async function renderPage(num) {
    if (rendering) return;
    rendering = true;
    try {
      var page = await pdfDoc.getPage(num);
      var scale = currentZoom === 'fit' ? getFitWidthScale(page) : currentZoom / 100;
      var viewport = page.getViewport({ scale: scale });
      var canvas = document.getElementById('pdfCanvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      var ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      document.getElementById('currentPage').textContent = num;

      // Update thumbnail active state
      document.querySelectorAll('.thumb-item').forEach(function(t, idx) {
        t.classList.toggle('active', idx === num - 1);
      });
    } catch(err) {
      showStatus('Error rendering page: ' + err.message, true);
    }
    rendering = false;
  }

  function getFitWidthScale(page) {
    var container = document.getElementById('canvasArea');
    var baseViewport = page.getViewport({ scale: 1 });
    var availableWidth = container.clientWidth - 40;
    return availableWidth / baseViewport.width;
  }

  window.prevPage = function() {
    if (currentPageNum <= 1) return;
    currentPageNum--;
    renderPage(currentPageNum);
  };

  window.nextPage = function() {
    if (currentPageNum >= totalPagesCount) return;
    currentPageNum++;
    renderPage(currentPageNum);
  };

  window.goToPage = function(num) {
    if (num < 1 || num > totalPagesCount) return;
    currentPageNum = num;
    renderPage(currentPageNum);
  };

  window.setZoom = function(zoom, btn) {
    currentZoom = zoom;
    document.querySelectorAll('.controls-bar .size-btn').forEach(function(b){ b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    renderPage(currentPageNum);
  };

  window.toggleThumbnails = function() {
    var panel = document.getElementById('thumbnailsPanel');
    panel.classList.toggle('visible');
  };

  async function generateThumbnails() {
    var panel = document.getElementById('thumbnailsPanel');
    panel.innerHTML = '';
    for (var i = 1; i <= totalPagesCount; i++) {
      (function(pageNum) {
        var item = document.createElement('div');
        item.className = 'thumb-item' + (pageNum === 1 ? ' active' : '');
        item.onclick = function() { goToPage(pageNum); };

        var thumbCanvas = document.createElement('canvas');
        item.appendChild(thumbCanvas);

        var label = document.createElement('div');
        label.className = 'thumb-page-num';
        label.textContent = 'Page ' + pageNum;
        item.appendChild(label);

        panel.appendChild(item);

        // Render thumbnail asynchronously
        pdfDoc.getPage(pageNum).then(function(page) {
          var vp = page.getViewport({ scale: 0.3 });
          thumbCanvas.width = vp.width;
          thumbCanvas.height = vp.height;
          var ctx = thumbCanvas.getContext('2d');
          page.render({ canvasContext: ctx, viewport: vp });
        });
      })(i);
    }
  }

  window.resetViewer = function() {
    pdfDoc = null;
    currentPageNum = 1;
    totalPagesCount = 0;
    currentZoom = 100;
    document.getElementById('openZone').style.display = 'flex';
    document.getElementById('viewerArea').style.display = 'none';
    document.getElementById('thumbnailsPanel').innerHTML = '';
    document.getElementById('thumbnailsPanel').classList.remove('visible');
    document.getElementById('statusMsg').style.display = 'none';
    fileInput.value = '';
    // Reset zoom buttons
    document.querySelectorAll('.controls-bar .size-btn').forEach(function(b){
      b.classList.remove('active');
      if (b.dataset.zoom === '100') b.classList.add('active');
    });
  };

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (!pdfDoc) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { prevPage(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { nextPage(); e.preventDefault(); }
    else if (e.key === '+' || e.key === '=') {
      var nextZoom = getNextZoomUp();
      var btn = document.querySelector('.controls-bar .size-btn[data-zoom="' + nextZoom + '"]');
      setZoom(nextZoom, btn);
      e.preventDefault();
    }
    else if (e.key === '-') {
      var nextZoom = getNextZoomDown();
      var btn = document.querySelector('.controls-bar .size-btn[data-zoom="' + nextZoom + '"]');
      setZoom(nextZoom, btn);
      e.preventDefault();
    }
  });

  var zoomLevels = [75, 100, 125, 150];
  function getNextZoomUp() {
    if (currentZoom === 'fit') return 100;
    for (var i = 0; i < zoomLevels.length; i++) {
      if (zoomLevels[i] > currentZoom) return zoomLevels[i];
    }
    return currentZoom;
  }
  function getNextZoomDown() {
    if (currentZoom === 'fit') return 100;
    for (var i = zoomLevels.length - 1; i >= 0; i--) {
      if (zoomLevels[i] < currentZoom) return zoomLevels[i];
    }
    return currentZoom;
  }

  function showStatus(msg, isError) {
    var el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg' + (isError ? ' error' : '');
    el.style.display = 'block';
  }

  // Sidebar
  document.querySelectorAll(".side-nav .side-item").forEach(function(b){
    b.addEventListener("click",function(){
      var c=this.getAttribute("data-cat");
      window.location.href=c?"index.html#"+c:"index.html";
    });
  });
})();
</script>

</body>
</html>
